{{- if .Params.comments | default site.Params.comments }}
<div class="post-comments">
  <script src="https://giscus.app/client.js"
          data-repo="chainlinn/chainlinn.github.io"
          data-repo-id="R_kgDOTMp3Pg"
          data-category="General"
          data-category-id="DIC_kwDOTMp3Ps4DAfz6"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="light"
          data-lang="zh-CN"
          crossorigin="anonymous"
          async>
  </script>
  <script>
  (function() {
    function getGiscusTheme() {
      var t = document.documentElement.dataset.theme;
      if (t === 'dark') return 'noborder_dark';
      if (t === 'auto') return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'noborder_dark' : 'noborder_light';
      return 'noborder_light';
    }

    function sendTheme() {
      var iframe = document.querySelector('.giscus-frame');
      if (!iframe) return;
      iframe.contentWindow.postMessage({ giscus: { setConfig: { theme: getGiscusTheme() } } }, 'https://giscus.app');
    }

    // Watch theme toggle
    var observer = new MutationObserver(function() { sendTheme(); });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    // Watch system pref changes (for auto mode)
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() { sendTheme(); });

    // Send on load
    window.addEventListener('message', function(e) {
      if (e.origin !== 'https://giscus.app' || !e.data || !e.data.giscus) return;
      sendTheme();
    });
  })();
  </script>
</div>
{{- end }}
